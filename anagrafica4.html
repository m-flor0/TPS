<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Anagrafica 4.0</title>
</head>
<body>

<h3>Inserisci i tuoi dati</h3>

Nome: <input type="text" id="nome"><br><br>
Cognome: <input type="text" id="cognome"><br><br>
Indirizzo: <input type="text" id="indirizzo"><br><br>
Città: <input type="text" id="citta"><br><br>

Sesso:<br>
M <input type="radio" name="sesso" value="M">
F <input type="radio" name="sesso" value="F"><br><br>

Diplomi:<br>
Licenza Media <input type="checkbox" class="diploma" value="Licenza Media">
Diploma <input type="checkbox" class="diploma" value="Diploma">
Laurea <input type="checkbox" class="diploma" value="Laurea"><br><br>

Provincia:
<select id="provincia">
    <option value="RM">RM</option>
    <option value="MI">MI</option>
    <option value="TO">TO</option>
    <option value="FI">FI</option>
</select><br><br>

Sport praticati:<br>
<select id="sport" multiple size="4">
    <option value="Calcio">Calcio</option>
    <option value="Basket">Basket</option>
    <option value="Tennis">Tennis</option>
    <option value="Nuoto">Nuoto</option>
</select><br><br>

<input type="button" value="Salva Dati e Visualizza" onclick="salvaDati()">

<div id="risultato"></div>

<script>
let collection = [];

function salvaDati() {
    const anagrafica = {
        nome: document.getElementById("nome").value,
        cognome: document.getElementById("cognome").value,
        indirizzo: document.getElementById("indirizzo").value,
        citta: document.getElementById("citta").value,
        sesso: document.querySelector('input[name="sesso"]:checked') ? document.querySelector('input[name="sesso"]:checked').value : "Non selezionato",
        diplomi: [],
        provincia: document.getElementById("provincia").value,
        sport: []
    };

    let diplomiSelezionati = document.querySelectorAll('.diploma:checked');
    for (let i = 0; i < diplomiSelezionati.length; i++) {
        anagrafica.diplomi.push(diplomiSelezionati[i].value);
    }

    let sportSelezionati = document.querySelectorAll('#sport option:checked');
    for (let i = 0; i < sportSelezionati.length; i++) {
        anagrafica.sport.push(sportSelezionati[i].value);
    }

    collection.push(anagrafica);

    localStorage.setItem('collection', JSON.stringify(collection));

    mostraTabella();
}

function mostraTabella() {
    collection = JSON.parse(localStorage.getItem('collection'));

    if (collection.length === 0) {
        document.getElementById("risultato").innerHTML = "<p>Nessun dato salvato.</p>";
        return;
    }

    let tabella = "<table border='1' cellpadding='5'>" +
        "<tr><th>Nome</th><th>Cognome</th><th>Indirizzo</th><th>Città</th>" +
        "<th>Sesso</th><th>Diplomi</th><th>Provincia</th><th>Sport</th></tr>";

    for (let i = 0; i < collection.length; i++) {
        let dato = collection[i];

        let diplomi = "";
        for (let j = 0; j < dato.diplomi.length; j++) {
            diplomi += dato.diplomi[j];
            if (j < dato.diplomi.length - 1) {
                diplomi += ", ";
            }
        }

        let sport = "";
        for (let k = 0; k < dato.sport.length; k++) {
            sport += dato.sport[k];
            if (k < dato.sport.length - 1) {
                sport += ", ";
            }
        }

        tabella += "<tr><td>" + dato.nome +
            "</td><td>" + dato.cognome +
            "</td><td>" + dato.indirizzo +
            "</td><td>" + dato.citta +
            "</td><td>" + dato.sesso +
            "</td><td>" + diplomi +
            "</td><td>" + dato.provincia +
            "</td><td>" + sport +
            "</td></tr>";
    }

    tabella += "</table>";

    document.getElementById("risultato").innerHTML = tabella;
}

document.addEventListener("DOMContentLoaded", mostraTabella);
</script>

</body>
</html>
